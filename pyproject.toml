[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clickstream-analytics"
version = "0.1.0"
description = "Scalable real-time e-commerce trend and abandonment analytics"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
spark = ["pyspark>=3.5"]
test = ["pytest>=8.0"]

[project.scripts]
clickstream-replay = "clickstream_analytics.producer:main"
clickstream-speed = "clickstream_analytics.speed:main"
clickstream-merge = "clickstream_analytics.serving:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
